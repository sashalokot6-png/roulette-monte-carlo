<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рулетка — Метод Монте-Карло</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #111827, #1f2937);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }
  .app {
    width: min(1000px, 100%);
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  h1 { text-align:center; margin:0 0 8px; font-size:32px; }
  .subtitle { text-align:center; opacity:.75; margin-bottom:24px; }
  .main {
    display:grid;
    grid-template-columns: 380px 1fr;
    gap:28px;
    align-items:center;
  }
  .wheel-wrap {
    display:flex;
    justify-content:center;
    position:relative;
  }
  .pointer {
    position:absolute;
    top:-8px;
    z-index:5;
    width:0;height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:28px solid #fbbf24;
    filter: drop-shadow(0 3px 4px #000);
  }
  .wheel {
    width:330px;
    height:330px;
    border-radius:50%;
    border:12px solid #d1d5db;
    background:
      conic-gradient(
        #166534 0deg 9.73deg,
        #111 9.73deg 19.46deg,
        #b91c1c 19.46deg 29.19deg,
        #111 29.19deg 38.92deg,
        #b91c1c 38.92deg 48.65deg,
        #111 48.65deg 58.38deg,
        #b91c1c 58.38deg 68.11deg,
        #111 68.11deg 77.84deg,
        #b91c1c 77.84deg 87.57deg,
        #111 87.57deg 97.30deg,
        #b91c1c 97.30deg 107.03deg,
        #111 107.03deg 116.76deg,
        #b91c1c 116.76deg 126.49deg,
        #111 126.49deg 136.22deg,
        #b91c1c 136.22deg 145.95deg,
        #111 145.95deg 155.68deg,
        #b91c1c 155.68deg 165.41deg,
        #111 165.41deg 175.14deg,
        #b91c1c 175.14deg 184.87deg,
        #111 184.87deg 194.60deg,
        #b91c1c 194.60deg 204.33deg,
        #111 204.33deg 214.06deg,
        #b91c1c 214.06deg 223.79deg,
        #111 223.79deg 233.52deg,
        #b91c1c 233.52deg 243.25deg,
        #111 243.25deg 252.98deg,
        #b91c1c 252.98deg 262.71deg,
        #111 262.71deg 272.44deg,
        #b91c1c 272.44deg 282.17deg,
        #111 282.17deg 291.90deg,
        #b91c1c 291.90deg 301.63deg,
        #111 301.63deg 311.36deg,
        #b91c1c 311.36deg 321.09deg,
        #111 321.09deg 330.82deg,
        #b91c1c 330.82deg 340.55deg,
        #111 340.55deg 350.28deg,
        #b91c1c 350.28deg 360deg
      );
    transition: transform 1.8s cubic-bezier(.15,.75,.18,1);
    box-shadow: inset 0 0 0 5px #111, 0 10px 30px rgba(0,0,0,.4);
  }
  .center {
    position:absolute;
    width:82px;height:82px;
    border-radius:50%;
    background:#fbbf24;
    border:8px solid #111827;
    display:flex;align-items:center;justify-content:center;
    font-weight:bold;color:#111;
    font-size:20px;
    box-shadow:0 4px 12px #0008;
  }
  .controls {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:20px;
  }
  button {
    border:0;
    border-radius:12px;
    padding:14px 10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:#f3f4f6;
    color:#111827;
    transition:.15s;
  }
  button:hover { transform:translateY(-2px); background:white; }
  button:active { transform:translateY(0); }
  .reset { background:#374151; color:white; }
  .result {
    text-align:center;
    font-size:24px;
    font-weight:bold;
    min-height:36px;
    margin-bottom:18px;
  }
  .stats {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .stat {
    padding:16px 10px;
    background:rgba(0,0,0,.22);
    border-radius:14px;
    text-align:center;
  }
  .stat .label { font-size:18px; }
  .stat .count { font-size:25px; font-weight:bold; margin:5px 0; }
  .stat .percent { opacity:.75; }
  .theory {
    margin-top:18px;
    padding:15px;
    border-radius:14px;
    background:rgba(255,255,255,.06);
    text-align:center;
    line-height:1.5;
  }
  .formula {
    margin-top:18px;
    padding:15px;
    background:rgba(251,191,36,.12);
    border:1px solid rgba(251,191,36,.3);
    border-radius:14px;
    text-align:center;
    font-size:18px;
  }
  @media (max-width: 760px) {
    .main { grid-template-columns:1fr; }
    .wheel { width:280px;height:280px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>🎰 Європейська рулетка</h1>
  <div class="subtitle">Демонстрація методу Монте-Карло</div>

  <div class="main">
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <div class="wheel" id="wheel"></div>
      <div class="center">0–36</div>
    </div>

    <div>
      <div class="controls">
        <button onclick="spin(1)">Крутити 1 раз</button>
        <button onclick="spin(100)">100</button>
        <button onclick="spin(1000)">1 000</button>
        <button onclick="spin(10000)">10 000</button>
        <button class="reset" onclick="resetStats()">Скинути</button>
      </div>

      <div class="result" id="result">Натисни «Крутити»</div>

      <div class="stats">
        <div class="stat">
          <div class="label">🔴 Червоне</div>
          <div class="count" id="redCount">0</div>
          <div class="percent" id="redPercent">0%</div>
        </div>
        <div class="stat">
          <div class="label">⚫ Чорне</div>
          <div class="count" id="blackCount">0</div>
          <div class="percent" id="blackPercent">0%</div>
        </div>
        <div class="stat">
          <div class="label">🟢 Нуль</div>
          <div class="count" id="greenCount">0</div>
          <div class="percent" id="greenPercent">0%</div>
        </div>
      </div>

      <div class="theory">
        <b>Теоретична ймовірність:</b><br>
        🔴 Червоне: 18/37 = 48,65%<br>
        ⚫ Чорне: 18/37 = 48,65%<br>
        🟢 Нуль: 1/37 = 2,70%
      </div>

      <div class="formula">
        <b>Ідея Монте-Карло:</b><br>
        багато випадкових випробувань → статистика → наближений результат
      </div>
    </div>
  </div>
</div>

<script>
const redNumbers = new Set([
  1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36
]);

let red = 0, black = 0, green = 0, total = 0;
let rotation = 0;

function randomNumber() {
  return Math.floor(Math.random() * 37);
}

function colorOf(n) {
  if (n === 0) return "green";
  return redNumbers.has(n) ? "red" : "black";
}

function spin(times) {
  let last = 0;

  for (let i = 0; i < times; i++) {
    last = randomNumber();
    const color = colorOf(last);

    if (color === "red") red++;
    else if (color === "black") black++;
    else green++;

    total++;
  }

  rotation += 720 + Math.random() * 720;
  document.getElementById("wheel").style.transform =
    `rotate(${rotation}deg)`;

  const colorText = colorOf(last) === "red" ? "🔴 ЧЕРВОНЕ" :
                    colorOf(last) === "black" ? "⚫ ЧОРНЕ" : "🟢 НУЛЬ";

  document.getElementById("result").textContent =
    times === 1 ? `Випало ${last} — ${colorText}` :
    `Виконано ${times.toLocaleString("uk-UA")} обертань`;

  updateStats();
}

function updateStats() {
  if (!total) return;

  document.getElementById("redCount").textContent = red.toLocaleString("uk-UA");
  document.getElementById("blackCount").textContent = black.toLocaleString("uk-UA");
  document.getElementById("greenCount").textContent = green.toLocaleString("uk-UA");

  document.getElementById("redPercent").textContent =
    (red / total * 100).toFixed(2).replace(".", ",") + "%";

  document.getElementById("blackPercent").textContent =
    (black / total * 100).toFixed(2).replace(".", ",") + "%";

  document.getElementById("greenPercent").textContent =
    (green / total * 100).toFixed(2).replace(".", ",") + "%";
}

function resetStats() {
  red = 0; black = 0; green = 0; total = 0;
  document.getElementById("result").textContent = "Натисни «Крутити»";
  document.getElementById("redCount").textContent = "0";
  document.getElementById("blackCount").textContent = "0";
  document.getElementById("greenCount").textContent = "0";
  document.getElementById("redPercent").textContent = "0%";
  document.getElementById("blackPercent").textContent = "0%";
  document.getElementById("greenPercent").textContent = "0%";
}
</script>
</body>
</html>
